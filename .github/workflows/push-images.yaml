name: push-images
on:
  workflow_dispatch:
  workflow_call:
    # 只要调用者使用了 secrets: inherit，这里其实可以不声明 secrets。但为了严谨和自文档化，推荐声明。
    secrets:
      DOCKERHUB_TOKEN:
        required: false
      ACR_USERNAME:
        required: false
      ACR_PASSWORD:
        required: false
    inputs:
      image-tags:
        required: true
        type: string
      image-labels:
        required: false
        type: string
      dockerhub-username:
        required: false
        default: ''
        type: string
      platforms:
        default: 'linux/amd64,linux/arm64'
        required: false
        type: string
      registry-url:
        required: false
        type: string

jobs:
  push-images:
    name: Push Docker image to multiple registries
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Version
        id: get-version
        run: |
          VERSION=$(git describe --tags --always)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current Build Version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: login DockerHub
        if: inputs.dockerhub-username != ''
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub-username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: login ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: login ACR # 阿里云ACR
        if: inputs.registry-url != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry-url }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.image-tags }}
          labels: ${{ inputs.image-labels }}
          build-args: |
            VERSION=${{ steps.get-version.outputs.version }}
          cache-from: type=gha # 使用 GitHub Actions 缓存加速构建
          cache-to: type=gha,mode=max # 将构建缓存写入 GitHub Actions 缓存
