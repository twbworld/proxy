# 原始逻辑很健全，仅更新了 action 版本号
name: Go Test

on:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Add config.yaml
        run: cp config.example.yaml config.yaml

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Go Version
        run: go version

      - name: Run Tests
        run: go test -v ./...

      - name: Build Project
        run: go build -v ./...
