#开启调试
debug: true
#本项目名称
project_name: VPN会员系统
#gin监听的地址
gin_addr: :80
#访问项目的域名,端口默认80(如webhook所用)
domain: https://www.domain.com
#clash默认配置文件
clash_path: clash.yaml
#放置静态文件的目录
static_dir: static
# gin日志文件
gin_log_path: log/gin.log
# 运行日志文件
run_log_path: log/run.log
# 时区
tz: Asia/Shanghai
# 客户端订阅配置
subscribe:
  # 文件命名,避免重复修改, clash客户端可能会存在多个订阅配置
  filename: "config.yaml"
  # 更新间隔(小时)
  update_interval: 24
  # 卡片链接
  page_url: https://twbworld.github.io/proxy
# 数据库配置
database:
  #数据库类型(sqlite|mysql); 小应用sqlite, 大应用mysql
  type: sqlite
  #sqlite文件路径
  sqlite_path: "proxy.db"
  # mysql地址
  mysql_host: ""
  # mysql端口
  mysql_port: 3306
  # mysql数据库名
  mysql_dbname: ""
  # mysql用户名
  mysql_username: ""
  # mysql密码
  mysql_password: ""
# Telegram聊天室配置
telegram:
  # 聊天室token(BotFather创建)
  token: "0123456789:AAxxxx"
  # 用户id(userinfobot获取)
  id: 123456789
# 允许跨域的域名
cors:
  - "*"
proxies:
  # vless-tcp-vision-reality
  - name: "外网信息复杂_理智分辨真假_reality"
    type: vless
    server: x.x.x.x
    port: 443
    uuid: x-x-x-x-x
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.tesla.com
    network: tcp
    client-fingerprint: chrome
    reality-opts:
      public-key: xxx
      short-id: ""
  # vless-tcp-vision
  - name: ""
    type: vless
    server: x.x.x.x
    port: 443
    uuid: x-x-x-x-x
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: x.x.x.x
    network: tcp
    client-fingerprint: chrome
    skip-cert-verify: false
    alpn:
      - h2
      - http/1.1
    root: true
  # cdn上行vless-xhttp,下行reality
  - name: ""
    type: vless
    server: x.x.x.x
    port: 443
    uuid: x-x-x-x-x
    network: xhttp
    tls: true
    udp: true
    servername: x.x.x.x
    client-fingerprint: chrome
    alpn:
      - h2
    skip-cert-verify: false
    xhttp-opts:
      mode: auto
      path: "/xxx"
      extra:
        downloadSettings:
          address: 1.1.1.1
          port: 443
          network: xhttp
          security: reality
          realitySettings:
            serverName: www.tesla.com
            fingerprint: chrome
            show: false
            publicKey: xxx
            shortId: ""
          xhttpSettings:
            path: "/xxx"
            mode: auto
  # cdn:VLESS-grpc
  - name: ""
    type: vless
    server: x.x.x.x
    port: 443
    uuid: x-x-x-x-x
    udp: true
    tls: true
    servername: x.x.x.x
    network: grpc
    grpc-opts:
      grpc-service-name: xxx
    client-fingerprint: chrome
    alpn:
      - h2
    skip-cert-verify: false
